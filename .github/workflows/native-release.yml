name: Нативные сборки и выпуск в GitLab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-release.yml', 'ci/**', 'release-request.json']
permissions:
  contents: read
concurrency:
  group: native-release-v1.36.4
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'xander-cage12/yandex-tracker-report-build' && github.ref == 'refs/heads/main' && github.actor == 'xander-cage12'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m py_compile ci/release_1_36_4.py ci/strict_tests_1_36_4.py
      - run: python ci/release_1_36_4.py preflight
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          GITLAB_PUBLISH_TOKEN: ${{ secrets.GITLAB_PUBLISH_TOKEN }}
  build:
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: windows-x64, arch: x64}
          - {os: macos-15-intel, target: macos-x64, arch: x64}
          - {os: macos-15, target: macos-arm64, arch: arm64}
    env:
      TARGET: ${{ matrix.target }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Получение закреплённых приватных исходников
        id: sources
        run: python ci/release_1_36_4.py fetch
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
      - name: Сборка и проверка Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & powershell.exe -NoProfile -NonInteractive -Command "Get-Command Get-FileHash,Get-AuthenticodeSignature -ErrorAction Stop | Out-Null"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/release_1_36_4.py build
          exit $LASTEXITCODE
      - name: Сборка и проверка macOS
        if: runner.os != 'Windows'
        run: python ci/release_1_36_4.py build
      - name: Загрузка проверенных архивов в GitLab
        run: python ci/release_1_36_4.py upload
        env:
          GITLAB_PUBLISH_TOKEN: ${{ secrets.GITLAB_PUBLISH_TOKEN }}
      - name: Сохранение диагностики только в приватном GitLab
        if: failure() && steps.sources.outcome == 'success'
        run: python ci/release_1_36_4.py diagnostics
        env:
          GITLAB_PUBLISH_TOKEN: ${{ secrets.GITLAB_PUBLISH_TOKEN }}
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Проверка архивов и публикация нового выпуска в GitLab
        run: python ci/release_1_36_4.py release
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          GITLAB_PUBLISH_TOKEN: ${{ secrets.GITLAB_PUBLISH_TOKEN }}
